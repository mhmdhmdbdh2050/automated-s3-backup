name: Backup script checks

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n backup-script.sh scripts/test-backup.sh

      - name: Run offline backup tests
        run: bash scripts/test-backup.sh
